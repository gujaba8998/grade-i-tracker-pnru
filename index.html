  body { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; background-color: var(--bg); color: var(--text); }
  input, select, textarea, button { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(8,167,215,.35); outline-offset: 2px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalPop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }

  /* ── Card hover lift ── */
  .gi-card { border: 1px solid var(--border); transition: box-shadow .2s ease, transform .2s ease; }
  .gi-card-hover:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

  .ge-brand-plaque { background:#fff; border-radius:12px; padding:7px 10px; box-shadow:0 8px 20px rgba(4,29,65,.16); }
  .ge-brand-plaque img { display:block; width:100%; height:100%; object-fit:contain; }
  .ge-login-stage { overflow:hidden; isolation:isolate; }
  .ge-login-stage::before { content:''; position:absolute; width:720px; height:720px; border:72px solid rgba(189,213,42,.16); border-radius:50%; top:-420px; left:-230px; z-index:-1; }
  .ge-login-stage::after { content:''; position:absolute; width:560px; height:560px; border:56px solid rgba(255,211,26,.14); border-radius:50%; bottom:-390px; right:-190px; z-index:-1; }
  .ge-role-option { position:relative; overflow:hidden; }
  .ge-role-option::after { content:''; position:absolute; width:5px; height:100%; right:0; top:0; background:var(--role-accent); transform:scaleY(0); transition:transform .18s ease; transform-origin:bottom; }
  .ge-role-option:hover::after { transform:scaleY(1); }
  .ge-sidebar-brand { position:relative; overflow:hidden; }
  .ge-sidebar-brand::after { content:''; position:absolute; height:3px; background:linear-gradient(90deg,var(--ge-cyan),var(--ge-lime),var(--ge-yellow)); left:0; right:0; bottom:0; }

  /* ── Skeleton shimmer ── */
  .gi-skeleton {
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
    background-size: 800px 100%;
    animation: shimmer 1.4s infinite linear;
  }

  /* ── Sticky table headers ── */
  table thead th { position: sticky; top: 0; z-index: 2; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* ── Mobile responsive ── */
  @media (max-width: 768px) {
    .gi-admin-shell { flex-direction: column !important; }
    .gi-sidebar {

      flex-direction: row !important; overflow-x: auto;

    }
    .gi-sidebar .gi-side-logo { display: none !important; }
    .gi-sidebar .gi-side-user { display: none !important; }
    .gi-sidebar nav { display: flex !important; flex: 1; padding: 0 !important; }
    .gi-sidebar nav button { flex-direction: column; gap: 2px !important; padding: 8px 12px !important; font-size: 11px !important; white-space: nowrap; border-left: none !important; border-bottom: 3px solid transparent; }
    .gi-sidebar .gi-side-bottom { flex-direction: row !important; border-top: none !important; }
    .gi-grid-2, .gi-grid-3 { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 480px) {
    .gi-grid-2, .gi-grid-3 { grid-template-columns: 1fr !important; }
  }

  /* ── Print ── */
  @media print {
    body * { visibility: hidden !important; }
    .print-only, .print-only * { visibility: visible !important; }
    .print-only { position: absolute !important; top: 0; left: 0; right: 0;
      display: block !important; padding: 20px; font-family: 'Sarabun', sans-serif; }
    @page { size: A4 portrait; margin: 15mm; }
  }
  .print-only { display: none; }

  _set: (k, v) => localStorage.setItem(LocalDB._key(k), JSON.stringify(v)),
  _recordKey: s => [s.semester || '', String(s.studentId || ''), String(s.courseCode || '').replace(/\D/g,'').padStart(7,'0'), String(s.section || '').replace(/\D/g,'').padStart(3,'0')].join('|'),

  init() {
    // Reset if version mismatch
    if (this._get('version') !== this._ver) {
      ['students','users','initialized','version'].forEach(k => localStorage.removeItem(this._key(k)));
    }
    if (!this._get('initialized')) {
      this._set('students', DEMO_STUDENTS);
      this._set('users', DEMO_USERS);
      this._set('version', this._ver);
      this._set('initialized', true);
    }
  },

  login(username, password) {
    const users = this._get('users') || DEMO_USERS;
    const u = users.find(u => u.username === username && u.password === password);
    if (!u) return { success:false, error:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' };
    return { success:true, role:u.role, displayName:u.displayName, courseAccess:u.courseAccess||[] };
  },

  getStudents(params) {
    let list = this._get('students') || [];
    if (params.studentId)    list = list.filter(s => String(s.studentId)  === String(params.studentId));
    if (params.courseCode)   list = list.filter(s => s.courseCode  === params.courseCode);
    if (params.status)       list = list.filter(s => s.status      === params.status);
    if (params.cause)        list = list.filter(s => s.cause       === params.cause);
    if (params.teacher)      list = list.filter(s => s.teacher     === params.teacher);
    if (params.semester)     list = list.filter(s => s.semester    === params.semester);
    if (params.courseAccess) {
      const acc = Array.isArray(params.courseAccess) ? params.courseAccess : params.courseAccess.split(',');
      if (acc.length > 0 && acc[0]) list = list.filter(s => acc.includes(s.courseCode));
    }
    return { success:true, data:list };
  },

  updateStatus(p) {
    const list = this._get('students') || [];
    if (!p.semester) return { success:false, error:'ไม่พบภาคการศึกษาของรายการ' };
    const idx = list.findIndex(s => this._recordKey(s) === this._recordKey(p));
    if (idx < 0) return { success:false, error:'ไม่พบข้อมูล' };
    const prev = list[idx];
    // ── Write audit log for status / grade changes ──
    if (p.status && p.status !== prev.status) {
      this._log({ action:'เปลี่ยนสถานะ', studentId:prev.studentId, studentName:prev.studentName, courseCode:prev.courseCode, courseName:prev.courseName, section:prev.section, semester:prev.semester, field:'สถานะ', from:prev.status||'-', to:p.status, by:p.by||'-' });
    }
    if (p.newGrade !== undefined && p.newGrade !== prev.newGrade) {
      this._log({ action:'แก้ไขเกรด', studentId:prev.studentId, studentName:prev.studentName, courseCode:prev.courseCode, courseName:prev.courseName, section:prev.section, semester:prev.semester, field:'เกรดใหม่', from:prev.newGrade||'-', to:p.newGrade, by:p.by||'-' });
    }
    list[idx] = { ...list[idx], status:p.status, notes:p.notes ?? list[idx].notes,
      ...(p.examScore !== undefined        ? {examScore:p.examScore}               : {}),
      ...(p.examScoreOutOf30 !== undefined ? {examScoreOutOf30:p.examScoreOutOf30} : {}),
      ...(p.newGrade !== undefined         ? {newGrade:p.newGrade}                 : {}) };
    this._set('students', list);
    return { success:true };
  },

  // ── Audit log ───────────────────────────────────────
  _log(entry) {
    const logs = this._get('logs') || [];
    logs.push({ timestamp: new Date().toISOString(), ...entry });
    this._set('logs', logs);
  },
  getLogs(params) {
    let logs = [...(this._get('logs') || [])].reverse(); // newest first
    const pr = params || {};
    if (pr.studentId) logs = logs.filter(l => String(l.studentId) === String(pr.studentId));
    if (pr.semester)  logs = logs.filter(l => (l.semester||'') === pr.semester);
    if (pr.action)    logs = logs.filter(l => l.action === pr.action);
    if (pr.by)        logs = logs.filter(l => l.by === pr.by);
    return { success:true, data: logs };
  },
  clearLogs() { this._set('logs', []); return { success:true }; },

  // ── Backup / Restore / Reset ─────────────────────────
  _ALL_KEYS: ['students','users','examScores','sectionTeachers','courseOfferings','logs'],
  exportAll() {
    const data = {};
    this._ALL_KEYS.forEach(k => { data[k] = this._get(k); });
    return { version:1, exportedAt:new Date().toISOString(), data };
  },
  importAll(dump) {
    if (!dump || !dump.data) return { success:false, error:'ไฟล์ไม่ถูกต้อง (ไม่พบ data)' };
    Object.entries(dump.data).forEach(([k,v]) => { if (v !== null && v !== undefined) this._set(k, v); });
    return { success:true };
  },
  // ── System settings (e.g. teacher menu visibility) ───────────
  getSettings() { return { success:true, data: this._get('settings') || {} }; },
  updateSettings(patch) {
    const cur = this._get('settings') || {};
    this._set('settings', { ...cur, ...patch });
    return { success:true };
  },

  clearAll() {
    this._set('students', []); this._set('examScores', []); this._set('logs', []);
    this._set('courseOfferings', {}); this._set('sectionTeachers', {});
    // keep users (accounts) intact
    return { success:true };
  },
  resetDemo() {
    this._set('students', DEMO_STUDENTS);
    this._set('users', DEMO_USERS);
    this._set('examScores', []); this._set('logs', []);
    this._set('courseOfferings', {}); this._set('sectionTeachers', {});
    return { success:true };
  },

  importStudents(students, semester, clear) {
    let list = this._get('students') || [];
    if (clear) list = list.filter(s => s.semester !== semester);
    let created = 0, updated = 0, skipped = 0;
    students.forEach(s => {
      const incoming = { ...s, semester: semester || s.semester, courseCode:String(s.courseCode||'').replace(/\D/g,'').padStart(7,'0'), section:String(s.section||'').replace(/\D/g,'').padStart(3,'0') };
      if (!incoming.studentId || !incoming.courseCode || !incoming.section || !incoming.bracketGrade) { skipped++; return; }
      const idx = list.findIndex(x => this._recordKey(x) === this._recordKey(incoming));
      if (idx >= 0) {
        list[idx] = { ...list[idx], studentName:incoming.studentName, courseName:incoming.courseName, teacher:incoming.teacher, bracketGrade:incoming.bracketGrade, cause:incoming.bracketGrade === 'E' ? 'ขาดสอบ' : 'ส่งงานไม่ครบ' };
        updated++;
      } else {
        list.push({ ...incoming, status: incoming.status || 'รอดำเนินการ' });
        created++;
      }
    });
    this._set('students', list);
    return { success:true, imported:created+updated, created, updated, skipped };
  },

  importExamScores(scores, semester) {
    // Tag each score with semester (overwrite if same key)
    const sem = semester || '';
    const tagged = scores.map(s => ({ ...s, semester: sem }));
    // Merge with existing scores: remove old entries for this semester first
    const keys = new Set(tagged.map(s => this._recordKey(s)));
    if (keys.size !== tagged.length) return { success:false, error:'พบรายการคะแนนซ้ำ' };
    const existing = (this._get('examScores') || []).filter(s => !keys.has(this._recordKey(s)));
    this._set('examScores', [...existing, ...tagged]);

    // Also update student records (existing behavior) — only students in matching semester
    const list = this._get('students') || [];
    let matched = 0, unmatched = 0;
    tagged.forEach(sc => {
      const s = list.find(x => this._recordKey(x) === this._recordKey(sc));
      if (s) {
        if (!s.studentName) s.studentName = sc.studentName;
        s.examScore = sc.rawScore;
        s.examScoreOutOf30 = sc.score30;
        s.scoreMax = sc.scoreMax;
        s.scoreNote = sc.scoreNote;
        matched++;
      } else unmatched++;
    });
    this._set('students', list);
    return { success:true, imported:scores.length, matched, unmatched };
  },

  getExamScores(params) {
    let list = this._get('examScores') || [];
    if (params.semester)   list = list.filter(s => (s.semester || '') === params.semester);
    if (params.courseCode) list = list.filter(s => s.courseCode === params.courseCode);
    if (params.courseName) {
      const q = params.courseName.toLowerCase();
      list = list.filter(s => (s.courseName || '').toLowerCase().includes(q));
    }
    if (params.section) list = list.filter(s => s.section === params.section);
    if (params.courseAccess) {
      const acc = Array.isArray(params.courseAccess) ? params.courseAccess : params.courseAccess.split(',');
      if (acc.length > 0 && acc[0]) list = list.filter(s => acc.includes(s.courseCode));
    }
    return { success:true, data:list };
  },

  getStats(semester) {
    let list = this._get('students') || [];
    if (semester) list = list.filter(s => s.semester === semester);
    const stats = { total:list.length, byStatus:{}, byCause:{}, byCourse:{} };
    list.forEach(s => {
      const st = s.status || 'รอดำเนินการ';
      stats.byStatus[st] = (stats.byStatus[st]||0)+1;
      stats.byCause[s.cause] = (stats.byCause[s.cause]||0)+1;
      const k = s.courseCode+'_'+s.section;
      if (!stats.byCourse[k]) stats.byCourse[k]={ courseCode:s.courseCode, courseName:s.courseName, teacher:s.teacher, section:s.section, total:0, done:0 };
      stats.byCourse[k].total++;
      if (st==='เสร็จสิ้น') stats.byCourse[k].done++;
    });
    return { success:true, data:stats };
  },

  getUsers() {
    const users = this._get('users') || DEMO_USERS;
    return { success:true, data:users.map(({password, ...u}) => ({...u, hasPassword:!!password})) };
  },

  addUser(u) {
    const list=this._get('users')||DEMO_USERS;
    if (list.find(x => x.username === u.username)) return { success:false, error:'ชื่อผู้ใช้นี้มีอยู่แล้ว' };
    list.push(u); this._set('users',list); return{success:true};
  },
  updateUser(username, patch) {
    const list = this._get('users') || DEMO_USERS;
    const idx = list.findIndex(u => u.username === username);
    if (idx < 0) return { success:false, error:'ไม่พบผู้ใช้' };
    // username can be changed too (patch.username)
    if (patch.username && patch.username !== username && list.find(u => u.username === patch.username))
      return { success:false, error:'ชื่อผู้ใช้ใหม่ซ้ำกับที่มีอยู่' };
    const cleanPatch = { ...patch };
    if (!cleanPatch.password) delete cleanPatch.password;
    list[idx] = { ...list[idx], ...cleanPatch };
    this._set('users', list); return { success:true };
  },
  deleteUser(username) { const list=(this._get('users')||DEMO_USERS).filter(u=>u.username!==username); this._set('users',list); return{success:true}; },

  // Course-section → teacher lookup table (auto-fill memory)
  getSectionTeachers() {
    return { success: true, data: this._get('sectionTeachers') || {} };
  },
  saveSectionTeachers(map) {
    const current = this._get('sectionTeachers') || {};
    Object.entries(map || {}).forEach(([k, v]) => { if (v) current[k] = v; });
    this._set('sectionTeachers', current);
    return { success: true };
  },

  // Course offerings (master table per semester)
  getCourseOfferings(semester) {
    const all = this._get('courseOfferings') || {};
    return { success: true, data: semester ? (all[semester] || {}) : all };
  },
  saveCourseOfferings(semester, map) {
    const all = this._get('courseOfferings') || {};
    all[semester] = { ...(all[semester] || {}), ...map };
    this._set('courseOfferings', all);
    return { success: true, count: Object.keys(map).length };
  },
  clearCourseOfferings(semester) {
    const all = this._get('courseOfferings') || {};
    delete all[semester];
    this._set('courseOfferings', all);
    return { success: true };
  },

  // Auto-create/update teacher accounts from parsed offerings
  upsertTeacherAccounts(teachers) {
    const users = this._get('users') || DEMO_USERS;
    let created = 0, updated = 0;

    teachers.forEach(t => {
      const id = String(t.teacherId);
      const name = t.teacherName || id;
      // Build courseAccess from their courses
      const courseAccess = [...new Set((t.courses || []).map(c => c.courseCode))];
      const existing = users.find(u => u.username === id);
      if (existing) {
        // Update display name and course access (merge courses)
        existing.displayName = name;
        existing.courseAccess = [...new Set([...(Array.isArray(existing.courseAccess) ? existing.courseAccess : String(existing.courseAccess||'').split(',').filter(Boolean)), ...courseAccess])];
        updated++;
      } else {
        users.push({ username: id, password: id, role: 'teacher', displayName: name, courseAccess });
        created++;
      }
    });
    this._set('users', users);
    return { success: true, created, updated };
  },

  // Re-sync all students in a semester with the current course offerings master table
  applyCourseOfferings(semester) {
    const all = this._get('courseOfferings') || {};
    const offerings = all[semester] || {};
    const students = this._get('students') || [];
    let updated = 0;
    students.forEach(s => {
      if (s.semester !== semester) return;
      const key = s.courseCode + '_' + s.section;
      const off = offerings[key];
      if (!off) return;
      let changed = false;
      if (off.courseName && s.courseName !== off.courseName) { s.courseName = off.courseName; changed = true; }
      if (off.teacher    && s.teacher    !== off.teacher)    { s.teacher    = off.teacher;    changed = true; }
      if (changed) updated++;
    });
    this._set('students', students);
    return { success: true, updated };
  },
};

// =====================================================================
// API — routes to GAS or LocalDB
// =====================================================================
const GAS_URL_KEY = 'grade_i_gas_url';
const DEMO_MODE_KEY = 'grade_i_demo_mode';
// Default GAS URL baked into the app — every device connects automatically.
// Admin can still override it per-device from ⚙️ ตั้งค่าระบบ if needed.
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzH0CYURUqcQUOl5c335972UX9QqBzI4z3Wfu6mrk1ZVAvDzESlO3EY6n_J-cFiVA4y2w/exec';
window.API = {
  token: '',
  get gasUrl() { return localStorage.getItem(DEMO_MODE_KEY) === '1' ? '' : (localStorage.getItem(GAS_URL_KEY) || DEFAULT_GAS_URL); },
  set gasUrl(v) {
    localStorage.removeItem(DEMO_MODE_KEY);
    v ? localStorage.setItem(GAS_URL_KEY, v) : localStorage.removeItem(GAS_URL_KEY);
  },
  useDemo() { this.token=''; localStorage.setItem(DEMO_MODE_KEY, '1'); },
  useDefaultGasUrl() { localStorage.removeItem(DEMO_MODE_KEY); localStorage.removeItem(GAS_URL_KEY); },
  get isDemo() { return !this.gasUrl; },

  // Repair semester values that Google Sheets auto-converted to dates.
  // e.g. "3/2568" typed in a cell becomes "2568-02-29T17:00:00.000Z".
  // We reconstruct "month/year" using a fixed +7h (Asia/Bangkok) offset.
  _normSem(v) {
    if (v == null || v === '') return '';
    const s = String(v);
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})T(\d{2}):/);
    if (!m) return s; // already "3/2568"
    const d = new Date(s);
    if (isNaN(d)) return s;
    const local = new Date(d.getTime() + 7 * 3600 * 1000);
    return (local.getUTCMonth() + 1) + '/' + local.getUTCFullYear();
  },
  _fixSemesters(res) {
    if (res && Array.isArray(res.data)) {
      res.data.forEach(r => { if (r && 'semester' in r) r.semester = this._normSem(r.semester); });
    }
    return res;
  },

  async _request(data) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    try {
      const r = await fetch(this.gasUrl, { method:'POST', body:JSON.stringify(data), signal:controller.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const result = await r.json();
      if (result && result.code === 'UNAUTHORIZED') {
        this.token = '';
        window.dispatchEvent(new CustomEvent('grade-i-session-expired'));
      }
      return result;
    } finally { clearTimeout(timer); }
  },
  async _gas(params, includeToken = true) {
    return this._request({ ...params, ...(includeToken && this.token ? { token:this.token } : {}) });
  },
  async _gasPost(data) { return this._gas(data, true); },

  async login(u, p)       {
    const result = this.isDemo ? LocalDB.login(u,p) : await this._gas({action:'login',username:u,password:p}, false);
    if (result && result.success && result.token) this.token = result.token;
    return result;
  },
  async logout()          { const token=this.token; this.token=''; return this.isDemo ? {success:true} : this._gas({action:'logout',token}, false); },
  async lookupStudent(id) { return this.isDemo ? LocalDB.getStudents({studentId:id}) : this._fixSemesters(await this._gas({action:'lookupStudent',studentId:id}, false)); },
  async getStudents(p)    { return this.isDemo ? LocalDB.getStudents(p)        : this._fixSemesters(await this._gas({action:'getStudents',...p})); },
  async getStats(sem)     { return this.isDemo ? LocalDB.getStats(sem)         : this._gas({action:'getStats',semester:sem}); },
  async getUsers()        { return this.isDemo ? LocalDB.getUsers()            : this._gas({action:'getUsers'}); },
  async updateStatus(p)   { return this.isDemo ? LocalDB.updateStatus(p)       : this._gasPost({action:'updateStatus',...p}); },
  async importStudents(s,sem,clr) { return this.isDemo ? LocalDB.importStudents(s,sem,clr) : this._gasPost({action:'importStudents',students:s,semester:sem,clearExisting:clr}); },
  async importExamScores(scores, semester) { return this.isDemo ? LocalDB.importExamScores(scores, semester) : this._gasPost({action:'upsertExamScoresV2',scores,semester}); },
  async getExamScores(params)    { return this.isDemo ? LocalDB.getExamScores(params||{}) : this._fixSemesters(await this._gas({action:'getExamScores',...(params||{})})); },
  async addUser(u)        { return this.isDemo ? LocalDB.addUser(u)            : this._gasPost({action:'addUser',user:u}); },
  async updateUser(name,patch) { return this.isDemo ? LocalDB.updateUser(name,patch) : this._gasPost({action:'updateUser',username:name,patch}); },
  async deleteUser(name)  { return this.isDemo ? LocalDB.deleteUser(name)      : this._gasPost({action:'deleteUser',username:name}); },
  async getSectionTeachers()    { return this.isDemo ? LocalDB.getSectionTeachers()      : this._gas({action:'getSectionTeachers'}); },
  async saveSectionTeachers(map) { return this.isDemo ? LocalDB.saveSectionTeachers(map) : this._gasPost({action:'saveSectionTeachers',map}); },
  async getCourseOfferings(sem)  { return this.isDemo ? LocalDB.getCourseOfferings(sem)  : this._gas({action:'getCourseOfferings',semester:sem}); },
  async saveCourseOfferings(sem, map) { return this.isDemo ? LocalDB.saveCourseOfferings(sem, map) : this._gasPost({action:'saveCourseOfferings',semester:sem,map}); },
  async clearCourseOfferings(sem){ return this.isDemo ? LocalDB.clearCourseOfferings(sem) : this._gasPost({action:'clearCourseOfferings',semester:sem}); },
  async applyCourseOfferings(sem){ return this.isDemo ? LocalDB.applyCourseOfferings(sem) : this._gasPost({action:'applyCourseOfferings',semester:sem}); },
  async upsertTeacherAccounts(teachers) { return this.isDemo ? LocalDB.upsertTeacherAccounts(teachers) : this._gasPost({action:'upsertTeacherAccounts',teachers}); },
  async getLogs(params)   { return this.isDemo ? LocalDB.getLogs(params||{}) : this._gas({action:'getLogs',...(params||{})}); },
  async clearLogs()       { return this.isDemo ? LocalDB.clearLogs()         : this._gasPost({action:'clearLogs'}); },
  async getSettings()     { return this.isDemo ? LocalDB.getSettings()       : this._gas({action:'getSettings'}); },
  async updateSettings(p) { return this.isDemo ? LocalDB.updateSettings(p)   : this._gasPost({action:'updateSettings',patch:p}); },
  // Backup/restore only operate on local data (GAS data lives in Sheets directly)
  exportAll()             { return LocalDB.exportAll(); },
  importAll(dump)         { return LocalDB.importAll(dump); },
  clearAll()              { return LocalDB.clearAll(); },
  resetDemo()             { return LocalDB.resetDemo(); },
};

LocalDB.init();
</script>

<script type="text/babel">

const displayUsername = u => u.role === 'teacher' && /^\d{1,7}$/.test(String(u.username)) ? String(u.username).padStart(7, '0') : String(u.username);
const AdminSettings = ({ user }) => {

  const [settings, setSettings] = React.useState({});

  React.useEffect(() => {

    else { setSettings(p => ({ ...p, teacherStudentsTabVisible: !next })); toast(res.error||'เกิดข้อผิดพลาด', 'error'); }
  };

  const saveGas = () => {

  };

  const handleAddUser = async () => {

      toast('เพิ่มผู้ใช้สำเร็จ', 'success');
      setNewUser({ username:'', password:'', role:'teacher', displayName:'', courseAccess:'' });
      window.API.getUsers().then(r => setUsers(r.data || []));
    } else { toast(res.error||'เกิดข้อผิดพลาด','error'); }
    setAddingUser(false);
  };

  const handleDelete = async (username) => {
    if (username === 'admin') { toast('ไม่สามารถลบ Admin หลักได้', 'error'); return; }
    const res = await window.API.deleteUser(username);
    if (res.success) { toast('ลบผู้ใช้แล้ว', 'success'); setUsers(p => p.filter(u => u.username !== username)); }
  };

  const openEdit = (u) => {
    setEditUser(u);
    setEditForm({
      username: displayUsername(u), password: '', role: u.role,
      displayName: u.displayName, courseAccess: Array.isArray(u.courseAccess) ? u.courseAccess.join(',') : (u.courseAccess || ''),
    });
  };

  const handleSaveEdit = async () => {
    if (!editForm.username || !editForm.displayName) { toast('กรุณากรอกข้อมูลให้ครบ', 'error'); return; }
    setSavingEdit(true);
    const res = await window.API.updateUser(editUser.username, { ...editForm });
    if (res.success) {
      toast('บันทึกการแก้ไขแล้ว', 'success');
      setEditUser(null);
      window.API.getUsers().then(r => setUsers(r.data || []));
    } else { toast(res.error || 'เกิดข้อผิดพลาด', 'error'); }
    setSavingEdit(false);
  };

  // ── Backup / Restore / Clear ──────────────────────────────────
  const handleBackup = () => {
    const dump = window.API.exportAll();
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-grade-i_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('สำรองข้อมูลเรียบร้อย ✅', 'success');
  };

  const handleRestore = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const dump = JSON.parse(ev.target.result);
        const res = window.API.importAll(dump);
        if (res.success) { toast('กู้คืนข้อมูลเรียบร้อย — กำลังรีโหลด...', 'success'); setTimeout(()=>window.location.reload(), 1200); }
        else toast(res.error || 'ไฟล์ไม่ถูกต้อง', 'error');
      } catch { toast('ไม่สามารถอ่านไฟล์ได้ — ต้องเป็นไฟล์ .json ที่สำรองจากระบบนี้', 'error'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const doConfirm = () => {
    if (confirmAction === 'clear') { window.API.clearAll(); toast('ล้างข้อมูลแล้ว — กำลังรีโหลด...', 'success'); }
    else if (confirmAction === 'reset') { window.API.resetDemo(); toast('รีเซ็ตเป็นข้อมูลตัวอย่างแล้ว — กำลังรีโหลด...', 'success'); }
    setConfirmAction(null);
    setTimeout(()=>window.location.reload(), 1200);
  };

  return (
    <div style={{ padding:'28px 28px', maxWidth:720 }}>
      <div style={{ fontSize:20, fontWeight:700, color:'var(--text)', marginBottom:24 }}>⚙️ ตั้งค่าระบบ</div>

      {/* GAS URL */}
      <Card style={{ padding:'20px 22px', marginBottom:24 }}>
        <div style={{ fontWeight:700, color:'var(--text)', marginBottom:4 }}>🔗 Google Apps Script URL</div>
        <div style={{ fontSize:13, color:'var(--text-muted)', marginBottom:14 }}>
          {window.API.isDemo ? '⚠️ ขณะนี้อยู่ในโหมด Demo (ข้อมูลเก็บใน Browser) — ใส่ URL เพื่อเชื่อมต่อ Google Sheets' : '✅ เชื่อมต่อ Google Sheets แล้ว'}
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <input value={gasUrl} onChange={e=>setGasUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" style={{ flex:1, padding:'10px 12px', borderRadius:8, border:'1px solid var(--border)', fontSize:13, fontFamily:'Sarabun', outline:'none' }} />
          <button onClick={saveGas} style={{ padding:'10px 20px', borderRadius:8, border:'none', background: saved?'#16a34a':'#0d2c6b', color:'#fff', cursor:'pointer', fontFamily:'Sarabun', fontWeight:600, whiteSpace:'nowrap' }}>{saved?'✓ บันทึกแล้ว':'บันทึก'}</button>
        </div>
        <div style={{ marginTop:10, fontSize:12, color:'var(--text-dim)' }}>เว้นว่างแล้วกดบันทึกเพื่อใช้ Demo Mode หรือวาง URL จาก Apps Script Deployment</div>
        {(gasUrl !== DEFAULT_GAS_URL || window.API.isDemo) && <button onClick={()=>{window.API.useDefaultGasUrl();setGasUrl(window.API.gasUrl);toast('กลับไปใช้ URL เริ่มต้นของระบบแล้ว','info');}} style={{ marginTop:8, background:'none', border:'none', color:'#dc2626', cursor:'pointer', fontSize:12, fontFamily:'Sarabun' }}>↩ กลับไปใช้ URL เริ่มต้นของระบบ</button>}
      </Card>

      {/* Teacher menu visibility */}
      <Card style={{ padding:'20px 22px', marginBottom:24 }}>
        <div style={{ fontWeight:700, color:'var(--text)', marginBottom:4 }}>👨‍🏫 เมนูในระบบอาจารย์</div>
        <div style={{ fontSize:13, color:'var(--text-muted)', marginBottom:16 }}>ควบคุมเมนูที่อาจารย์มองเห็น — เฉพาะ Admin เท่านั้นที่เปิด/ปิดได้</div>
        <label style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:14, padding:'14px 16px', borderRadius:10, border:'1px solid var(--border)', cursor:'pointer', background:'var(--surface-2)' }}>
          <div>
            <div style={{ fontWeight:600, fontSize:14, color:'var(--text)' }}>👥 เมนู "นักศึกษาที่ติด I"</div>
            <div style={{ fontSize:12, color:'var(--text-muted)', marginTop:3 }}>
              {settings.teacherStudentsTabVisible
                ? 'เปิดอยู่ — อาจารย์เห็นทั้ง 2 เมนู (นักศึกษาที่ติด I + คะแนนสอบรอบ 2)'
                : 'ปิดอยู่ — อาจารย์เห็นเฉพาะเมนู "คะแนนสอบปลายภาครอบ 2"'}
            </div>
          </div>
          <div onClick={(e)=>{e.preventDefault();toggleTeacherStudentsTab();}} style={{
            width:48, height:26, borderRadius:20, flexShrink:0, position:'relative', transition:'background .2s',
            background: settings.teacherStudentsTabVisible ? '#16a34a' : 'var(--border)', cursor:'pointer'
          }}>
            <div style={{ position:'absolute', top:3, left: settings.teacherStudentsTabVisible ? 25 : 3, width:20, height:20, borderRadius:'50%', background:'#fff', transition:'left .2s', boxShadow:'0 1px 3px rgba(0,0,0,.3)' }}></div>
          </div>
        </label>
      </Card>

      {/* Backup / Restore / Clear data */}
      <Card style={{ padding:'20px 22px', marginBottom:24 }}>
        <div style={{ fontWeight:700, color:'var(--text)', marginBottom:4 }}>💾 สำรอง / กู้คืน / ล้างข้อมูล</div>
        <div style={{ fontSize:13, color:'var(--text-muted)', marginBottom:16 }}>
          สำรองข้อมูลทั้งระบบเป็นไฟล์ JSON เพื่อกันข้อมูลหาย (โดยเฉพาะใน Demo Mode) และกู้คืนเมื่อย้ายเครื่องหรือเปิดเทอมใหม่
        </div>
        <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:18 }}>
          <button onClick={handleBackup} style={{ flex:1, minWidth:160, padding:'12px 16px', borderRadius:10, border:'1px solid #0d2c6b', background:'var(--surface)', color:'#0d2c6b', cursor:'pointer', fontFamily:'Sarabun', fontWeight:600, fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>⬇️ สำรองข้อมูล (Export JSON)</button>
          <button onClick={()=>restoreRef.current?.click()} style={{ flex:1, minWidth:160, padding:'12px 16px', borderRadius:10, border:'1px solid #16a34a', background:'var(--surface)', color:'#16a34a', cursor:'pointer', fontFamily:'Sarabun', fontWeight:600, fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>⬆️ กู้คืนข้อมูล (Import JSON)</button>
          <input ref={restoreRef} type="file" accept=".json,application/json" onChange={handleRestore} style={{ display:'none' }} />
        </div>
        <div style={{ borderTop:'1px solid var(--border-soft)', paddingTop:16 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#dc2626', marginBottom:10 }}>⚠️ Danger Zone</div>
          <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
            <button onClick={()=>setConfirmAction('clear')} style={{ padding:'9px 16px', borderRadius:8, border:'1px solid #fca5a5', background:'var(--surface)', color:'#dc2626', cursor:'pointer', fontFamily:'Sarabun', fontSize:13 }}>🗑️ ล้างข้อมูลทดสอบทั้งหมด</button>
            <button onClick={()=>setConfirmAction('reset')} style={{ padding:'9px 16px', borderRadius:8, border:'1px solid var(--border)', background:'var(--surface)', color:'var(--text-muted)', cursor:'pointer', fontFamily:'Sarabun', fontSize:13 }}>↩️ รีเซ็ตเป็นข้อมูลตัวอย่าง (Demo)</button>
          </div>
          <div style={{ fontSize:12, color:'var(--text-dim)', marginTop:10 }}>
            "ล้างข้อมูลทดสอบ" จะลบ นักศึกษา / คะแนน / รายวิชา / ประวัติ ทั้งหมด (คงบัญชีผู้ใช้ไว้) — ใช้ก่อนเริ่มใช้งานจริง
          </div>
        </div>
      </Card>

      {/* User Management */}
      <Card style={{ overflow:'hidden' }}>
        <div style={{ padding:'14px 20px', borderBottom:'1px solid var(--border-soft)', fontWeight:700, color:'var(--text)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span>👤 จัดการผู้ใช้งาน</span>
        </div>
        <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:14 }}>
          <thead><tr style={{background:'var(--surface-2)'}}>
            {['ชื่อผู้ใช้','รหัสผ่าน','ชื่อที่แสดง','บทบาท','รายวิชา','',''].map((h,hi)=>(<th key={hi} style={{padding:'9px 14px',textAlign:'left',fontSize:12,fontWeight:600,color:'var(--text-muted)',borderBottom:'1px solid var(--border)',whiteSpace:'nowrap'}}>{h}</th>))}
          </tr></thead>
          <tbody>
            {users.map((u,i)=>(
              <tr key={i} style={{borderBottom:'1px solid var(--border-soft)'}}>
                <td style={{padding:'9px 14px',fontFamily:'monospace',fontSize:13}}>{displayUsername(u)}</td>
                <td style={{padding:'9px 14px',fontFamily:'monospace',fontSize:13}}>
                  <span style={{color:'var(--text-dim)'}}>{u.hasPassword ? 'ตั้งค่าแล้ว' : 'ยังไม่ได้ตั้ง'}</span>
                </td>
                <td style={{padding:'9px 14px',fontWeight:500}}>{u.displayName}</td>
                <td style={{padding:'9px 14px'}}><span style={{background:u.role==='admin'?'#eff6ff':'#f0fdf4',color:u.role==='admin'?'#1d4ed8':'#16a34a',padding:'2px 10px',borderRadius:20,fontSize:12,fontWeight:600}}>{u.role==='admin'?'Admin':'อาจารย์'}</span></td>
                <td style={{padding:'9px 14px',fontSize:12,color:'var(--text-dim)',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(Array.isArray(u.courseAccess)?u.courseAccess.join(','):u.courseAccess)||'—'}</td>
                <td style={{padding:'9px 14px'}}><button onClick={()=>openEdit(u)} style={{background:'none',border:'1px solid #0d2c6b',color:'#0d2c6b',padding:'3px 12px',borderRadius:6,cursor:'pointer',fontSize:12,fontFamily:'Sarabun',fontWeight:600}}>แก้ไข</button></td>
                <td style={{padding:'9px 14px'}}>{u.username!=='admin'&&<button onClick={()=>handleDelete(u.username)} style={{background:'none',border:'1px solid #fca5a5',color:'#dc2626',padding:'3px 10px',borderRadius:6,cursor:'pointer',fontSize:12,fontFamily:'Sarabun'}}>ลบ</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
        {/* Add user form */}
        <div style={{ padding:'14px 20px', borderTop:'1px solid var(--border-soft)', background:'var(--surface-2)' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'var(--text)', marginBottom:10 }}>+ เพิ่มผู้ใช้ใหม่</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:10, marginBottom:10 }}>
            <input value={newUser.username} onChange={e=>setNewUser(p=>({...p,username:e.target.value}))} placeholder="Username" style={{padding:'8px 10px',borderRadius:7,border:'1px solid var(--border)',fontSize:13,fontFamily:'Sarabun',outline:'none'}} />
            <input type="password" value={newUser.password} onChange={e=>setNewUser(p=>({...p,password:e.target.value}))} placeholder="Password" autoComplete="new-password" style={{padding:'8px 10px',borderRadius:7,border:'1px solid var(--border)',fontSize:13,fontFamily:'Sarabun',outline:'none'}} />
            <input value={newUser.displayName} onChange={e=>setNewUser(p=>({...p,displayName:e.target.value}))} placeholder="ชื่อที่แสดง" style={{padding:'8px 10px',borderRadius:7,border:'1px solid var(--border)',fontSize:13,fontFamily:'Sarabun',outline:'none'}} />
            <select value={newUser.role} onChange={e=>setNewUser(p=>({...p,role:e.target.value}))} style={{padding:'8px 10px',borderRadius:7,border:'1px solid var(--border)',fontSize:13,fontFamily:'Sarabun',background:'var(--surface)',outline:'none'}}>
              <option value="admin">Admin</option><option value="teacher">อาจารย์</option>
            </select>
            <input value={newUser.courseAccess} onChange={e=>setNewUser(p=>({...p,courseAccess:e.target.value}))} placeholder="รหัสวิชา (คั่นด้วย ,)" style={{padding:'8px 10px',borderRadius:7,border:'1px solid var(--border)',fontSize:13,fontFamily:'Sarabun',outline:'none'}} />
          </div>
          <button onClick={handleAddUser} disabled={addingUser} style={{padding:'8px 20px',borderRadius:7,border:'none',background:'#0d2c6b',color:'#fff',cursor:'pointer',fontFamily:'Sarabun',fontSize:13,fontWeight:600}}>
            {addingUser?'กำลังเพิ่ม...':'เพิ่มผู้ใช้'}
          </button>
        </div>
      </Card>

      {/* Edit User Modal */}
      <Modal open={!!editUser} onClose={()=>setEditUser(null)} title="แก้ไขข้อมูลผู้ใช้" width={460}>
        {editUser && (
          <div>
            <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
              <div>
                <label style={{ fontSize:13, fontWeight:600, color:'var(--text)', display:'block', marginBottom:6 }}>ชื่อผู้ใช้ (Username)</label>
                <input value={editForm.username} disabled={editUser.username==='admin'} onChange={e=>setEditForm(p=>({...p,username:e.target.value}))} style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--border)', fontSize:14, fontFamily:'Sarabun', outline:'none', boxSizing:'border-box', opacity: editUser.username==='admin'?.6:1 }} />
                {editUser.username==='admin' && <div style={{ fontSize:11, color:'var(--text-dim)', marginTop:4 }}>ไม่สามารถเปลี่ยนชื่อ Admin หลักได้</div>}
              </div>
              <div>
                <label style={{ fontSize:13, fontWeight:600, color:'var(--text)', display:'block', marginBottom:6 }}>ตั้งรหัสผ่านใหม่ <span style={{fontWeight:400,color:'var(--text-dim)'}}>(เว้นว่างเพื่อใช้รหัสเดิม)</span></label>
                <input type="password" value={editForm.password} autoComplete="new-password" onChange={e=>setEditForm(p=>({...p,password:e.target.value}))} style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--border)', fontSize:14, fontFamily:'monospace', outline:'none', boxSizing:'border-box' }} />
              </div>
              <div>
                <label style={{ fontSize:13, fontWeight:600, color:'var(--text)', display:'block', marginBottom:6 }}>ชื่อที่แสดง</label>
                <input value={editForm.displayName} onChange={e=>setEditForm(p=>({...p,displayName:e.target.value}))} style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--border)', fontSize:14, fontFamily:'Sarabun', outline:'none', boxSizing:'border-box' }} />
              </div>
              <div>
                <label style={{ fontSize:13, fontWeight:600, color:'var(--text)', display:'block', marginBottom:6 }}>บทบาท</label>
                <select value={editForm.role} disabled={editUser.username==='admin'} onChange={e=>setEditForm(p=>({...p,role:e.target.value}))} style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--border)', fontSize:14, fontFamily:'Sarabun', background:'var(--surface)', outline:'none', opacity: editUser.username==='admin'?.6:1 }}>
                  <option value="admin">Admin</option><option value="teacher">อาจารย์</option>
                </select>
              </div>
              <div>
                <label style={{ fontSize:13, fontWeight:600, color:'var(--text)', display:'block', marginBottom:6 }}>รายวิชาที่รับผิดชอบ <span style={{fontWeight:400,color:'var(--text-dim)'}}>(รหัสวิชา คั่นด้วย ,)</span></label>
                <input value={editForm.courseAccess} onChange={e=>setEditForm(p=>({...p,courseAccess:e.target.value}))} placeholder="เช่น 0010102,0010202" style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--border)', fontSize:14, fontFamily:'Sarabun', outline:'none', boxSizing:'border-box' }} />
              </div>
            </div>
            <div style={{ display:'flex', gap:10, justifyContent:'flex-end', marginTop:22 }}>
              <button onClick={()=>setEditUser(null)} style={{ padding:'9px 20px', borderRadius:8, border:'1px solid var(--border)', background:'var(--surface)', cursor:'pointer', fontFamily:'Sarabun', fontSize:14, color:'var(--text)' }}>ยกเลิก</button>
              <button onClick={handleSaveEdit} disabled={savingEdit} style={{ padding:'9px 22px', borderRadius:8, border:'none', background: savingEdit?'#9ca3af':'#0d2c6b', color:'#fff', cursor:savingEdit?'not-allowed':'pointer', fontFamily:'Sarabun', fontSize:14, fontWeight:700 }}>{savingEdit?'กำลังบันทึก...':'บันทึก'}</button>
            </div>
          </div>
        )}
      </Modal>

      <ConfirmDialog
        open={!!confirmAction}
        title={confirmAction === 'reset' ? 'รีเซ็ตเป็นข้อมูลตัวอย่าง?' : 'ล้างข้อมูลทดสอบทั้งหมด?'}
        message={confirmAction === 'reset'
          ? 'จะแทนที่ข้อมูลปัจจุบันทั้งหมดด้วยข้อมูลตัวอย่าง (Demo) — ควรสำรองข้อมูลก่อนหากต้องการเก็บไว้'
          : 'จะลบ นักศึกษา / คะแนน / รายวิชา / ประวัติ ทั้งหมดอย่างถาวร (บัญชีผู้ใช้ยังอยู่) — ควรสำรองข้อมูลก่อน'}
        danger
        onConfirm={doConfirm}
        onCancel={()=>setConfirmAction(null)}
      />
    </div>
  );
};

// ── Main App ──────────────────────────────────────────────────
const App = () => {
  const [auth, setAuth] = React.useState(null);
  const [activeTab, setActiveTab] = React.useState('dashboard');
  const { theme, toggle: toggleTheme } = useTheme();

  const handleLogin = (result) => setAuth(result);
  const handleLogout = () => { window.API.logout().catch(()=>{}); setAuth(null); setActiveTab('dashboard'); };
  React.useEffect(() => {
    const expired = () => { setAuth(null); setActiveTab('dashboard'); };
    window.addEventListener('grade-i-session-expired', expired);
    return () => window.removeEventListener('grade-i-session-expired', expired);
  }, []);

  if (!auth) return <ToastProvider><Login onLogin={handleLogin} theme={theme} toggleTheme={toggleTheme} /></ToastProvider>;

  if (auth.role === 'student') return (
    <ToastProvider>
      <StudentView studentId={auth.studentId} onBack={handleLogout} theme={theme} toggleTheme={toggleTheme} />
    </ToastProvider>
  );

  if (auth.role === 'teacher') return (
    <ToastProvider>
      <TeacherView user={auth} onLogout={handleLogout} theme={theme} toggleTheme={toggleTheme} />
    </ToastProvider>
  );

  if (auth.role !== 'admin') return <ToastProvider><Login onLogin={handleLogin} theme={theme} toggleTheme={toggleTheme} /></ToastProvider>;

  // Admin
  const DEMO_BANNER = window.API.isDemo;
  return (
    <ToastProvider>
      {DEMO_BANNER && (
        <div style={{ background:'#fef3c7', borderBottom:'1px solid #fcd34d', padding:'8px 20px', fontSize:13, color:'#92400e', textAlign:'center', zIndex:999 }}>
          ⚠️ <strong>Demo Mode</strong> — ข้อมูลเก็บใน Browser นี้เท่านั้น ไปที่ <strong>ตั้งค่าระบบ</strong> เพื่อเชื่อมต่อ Google Sheets
        </div>
      )}
      <AdminLayout user={auth} activeTab={activeTab} onTabChange={setActiveTab} onLogout={handleLogout} theme={theme} toggleTheme={toggleTheme}>
        {activeTab === 'dashboard' && <AdminDashboard user={auth} />}
        {activeTab === 'students'  && <AdminStudents  user={auth} />}
        {activeTab === 'grade'     && <AdminGrade     user={auth} />}
        {activeTab === 'compare'   && <AdminCompare   user={auth} />}
        {activeTab === 'reports'   && <AdminReports   user={auth} />}
        {activeTab === 'log'       && <AdminLog       user={auth} />}
        {activeTab === 'import'    && <AdminImport    user={auth} />}
        {activeTab === 'form'      && <AdminForm      user={auth} />}
        {activeTab === 'settings'  && <AdminSettings  user={auth} />}
      </AdminLayout>
    </ToastProvider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
